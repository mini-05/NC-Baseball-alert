<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NC 다이노스 경기 알림</title>
<meta name="theme-color" content="#f2f4f6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="NC 알림" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="icon" href="/icon-192.png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<header class="header">
  <p class="header-eyebrow">NC 다이노스</p>
  <h1 class="header-title">경기 알림</h1>

  <div class="segmented" role="tablist">
    <button class="seg is-active" data-tab="history" role="tab">기록</button>
    <button class="seg" data-tab="settings" role="tab">알림</button>
    <span class="seg-thumb" aria-hidden="true"></span>
  </div>
</header>

<main>
  <!-- ─────────── 기록 ─────────── -->
  <section id="panel-history" class="panel is-active">
    <div id="standings" class="standings-slot"></div>
    <div id="history">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </section>

  <!-- ─────────── 알림 ─────────── -->
  <section id="panel-settings" class="panel">
    <div class="card card-hero">
      <div class="hero-row">
        <div>
          <h2 class="hero-title">푸시 알림</h2>
          <p id="push-desc" class="hero-desc">확인하고 있어요…</p>
        </div>
        <span id="push-dot" class="dot"></span>
      </div>
      <button id="btn-toggle" class="btn btn-primary" disabled>확인 중</button>
      <button id="btn-test" class="btn btn-quiet" hidden>테스트 알림 보내기</button>
    </div>

    <h3 class="section-title">언제 알릴까요</h3>
    <div class="card card-list" id="kinds">
      <label class="row">
        <div class="row-text"><b>경기 시작</b><span>플레이볼 순간</span></div>
        <span class="sw"><input type="checkbox" data-key="start" disabled /><i></i></span>
      </label>
      <label class="row">
        <div class="row-text"><b>경기 취소</b><span>우천 등으로 취소될 때</span></div>
        <span class="sw"><input type="checkbox" data-key="cancel" disabled /><i></i></span>
      </label>
      <label class="row">
        <div class="row-text"><b>득점</b><span>점수가 바뀔 때마다</span></div>
        <span class="sw"><input type="checkbox" data-key="score" disabled /><i></i></span>
      </label>
      <label class="row">
        <div class="row-text"><b>경기 종료</b><span>최종 결과</span></div>
        <span class="sw"><input type="checkbox" data-key="end" disabled /><i></i></span>
      </label>
    </div>

    <h3 class="section-title">어떤 경기를 알릴까요</h3>
    <div class="card card-list" id="scopes">
      <label class="row">
        <div class="row-text"><b>정규시즌</b><span>3월~10월 페넌트레이스</span></div>
        <span class="sw"><input type="checkbox" data-key="regular" disabled /><i></i></span>
      </label>
      <label class="row">
        <div class="row-text"><b>포스트시즌</b><span>와일드카드 · 준PO · PO · 한국시리즈</span></div>
        <span class="sw"><input type="checkbox" data-key="postseason" disabled /><i></i></span>
      </label>
    </div>
    <p class="footnote">설정은 이 기기에만 적용돼요.</p>

    <div class="card card-hint" id="ios-hint" hidden>
      <h3>iPhone에서 알림 받기</h3>
      <p>
        iOS는 홈 화면에 추가한 앱에서만 알림을 지원해요.
        Safari 공유 버튼 → <b>홈 화면에 추가</b>를 누른 뒤,
        홈 화면 아이콘으로 다시 열어 주세요.
      </p>
    </div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
