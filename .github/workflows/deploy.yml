name: Deploy

on:
  push:
    branches: [main]
  # PR 에서도 test job 을 돌려서 main 에 넣기 전에 실패를 본다.
  # deploy job 은 아래 if 로 push 때만 돈다.
  pull_request:
    branches: [main]

# GITHUB_TOKEN 은 읽기만. 기본값은 쓰기까지 열려 있어서 워크플로 안의 코드가
# 오염되면 저장소를 고칠 수 있다.
permissions:
  contents: read

# 배포가 겹치면 예전 코드가 마지막에 올라갈 수 있어서 ref 별로 하나씩만 돈다.
# main 푸시는 한 그룹이라 순서대로 배포되고, PR 검증은 PR 마다 따로 돈다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 테스트·의존성 코드를 실행하는 job. 시크릿을 주지 않는다(배포 job 과 분리한 이유).
  # 의존성이 오염돼도 여기서는 가져갈 자격 증명이 없다.
  test:
    runs-on: ubuntu-latest
    steps:
      # action 은 커밋 SHA 로 고정한다. 태그(@v4)는 옮겨질 수 있어서.
      # 업데이트는 Dependabot 이 PR 로 올린다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # --ignore-scripts 로 postinstall 을 막는다. 이 옵션으로도 테스트와
      # wrangler 번들링(deploy --dry-run)이 되는 것을 확인했다.
      - run: npm ci --ignore-scripts
      - run: npm test

  deploy:
    needs: test
    # PR 은 검증만 하고 배포는 안 한다. 시크릿은 이 job 에만 있다.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # production environment 에 Required reviewers 를 걸면 배포 전 승인을 받게 된다.
    # (GitHub > Settings > Environments > production)
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # 토큰은 이 step 에만 준다.
      # ACCOUNT_ID 도 넘긴다. wrangler.toml 에 account_id 가 없어서 안 넘기면 wrangler 가
      # 계정 목록을 조회하는데, 그러려면 토큰에 Account Settings:Read 가 더 필요하다.
      # 넘기면 Workers Scripts:Edit + D1:Edit 만으로 된다.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
