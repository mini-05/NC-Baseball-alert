name: Diagnose push

# 수동 실행 전용. 알림이 안 올 때 "지금 실제로 보내 보는" 진단 도구다.
#
# 왜 필요한가 — 개발 환경에서 workers.dev 로 나가는 길이 막혀 있어 밖에서
# 워커를 부를 수가 없다. Actions 러너는 닿는다.
#
# 여기서 하는 일은 딱 둘이다.
#   1. D1 cache 에 diag:ping 한 줄을 *쓴다*. 구독 표는 읽지 않는다.
#   2. wrangler tail 로 워커가 남기는 로그를 지켜본다.
# 발송은 워커가 스스로 한다(src/index.js runDiagPing). 구독 암호키는 워커 밖으로
# 한 발짝도 안 나가고, CI 는 구독을 한 줄도 안 읽는다.
#
# 로그에 남는 것: 구독 수, endpoint 끝 12자, 푸시 서비스가 준 HTTP 상태.
on:
  workflow_dispatch:
    inputs:
      send:
        description: '실제로 푸시를 보낼지 (false 면 로그만 지켜본다)'
        type: boolean
        default: true
      watch_seconds:
        description: '로그를 지켜볼 시간(초)'
        type: string
        default: '150'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts

      # 쓰기 한 번. SELECT 가 없다는 점이 이 단계의 전부다.
      - name: 진단 핑 표시하기
        if: ${{ inputs.send }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute nc-alert --remote --command \
            "INSERT INTO cache (key, value, expires_at, updated_at)
             VALUES ('diag:ping', '1', datetime('now','+10 minutes'), datetime('now'))
             ON CONFLICT(key) DO UPDATE SET
               value='1', expires_at=excluded.expires_at, updated_at=excluded.updated_at"
          echo "핑을 써 뒀다. 다음 크론(최대 1분)에서 워커가 실제 푸시를 보낸다."

      # 크론은 1분마다 돈다. 핑 처리와 그 뒤 한두 틱을 함께 지켜본다.
      - name: 워커 로그 지켜보기
        run: |
          set -uo pipefail
          echo "=== ${{ inputs.watch_seconds }}초 동안 워커 로그를 지켜본다 ==="
          timeout "${{ inputs.watch_seconds }}" npx wrangler tail nc-baseball-alert \
            --format pretty || true
          echo "=== 끝 ==="
