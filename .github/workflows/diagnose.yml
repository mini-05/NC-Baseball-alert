name: Diagnose push

# 수동 실행 전용. 알림이 안 올 때 밖에서 워커 상태를 보는 진단 도구다.
#
# 왜 필요한가 — 개발 환경 프록시가 workers.dev 로 나가는 길을 게이트웨이
# 정책으로 막는다(403 CONNECT). Actions 러너는 닿는다.
#
# 보기만 한다. 하는 일은 둘뿐이다.
#   1. 공개 API(/api/history·/api/schedule) 조회 — 이벤트가 감지되고 있는지
#   2. (선택) wrangler tail 로 워커 로그 보기
#
# 알림을 실제로 보내는 기능은 뺐다. 저장소에 상시 놓인 "전 기기에 푸시 발송"
# 버튼은 진단 한 번의 값어치보다 위험이 크다 — 저장소에 쓰기 권한이 생기는
# 사람은 누구든 누를 수 있다. 다시 필요하면 그때 만든다.
#
# D1 도 구독 표도 건드리지 않는다. 읽는 것은 공개 GET 두 개와 워커 로그뿐이다.
on:
  workflow_dispatch:
    inputs:
      tail:
        description: '워커 로그를 지켜볼지'
        type: boolean
        default: true
      watch_seconds:
        description: '로그를 지켜볼 시간(초)'
        type: string
        default: '150'

permissions:
  contents: read

env:
  BASE: https://nc-baseball-alert.nc-kbo-alert.workers.dev

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts

      # 알림이 안 오는 원인은 크게 둘이다 — 감지가 안 됐거나, 감지는 됐는데
      # 발송이 막혔거나. events 에 행이 있으면 감지는 된 것이다. 둘을 여기서 가른다.
      - name: 감지 상태 보기 (공개 API)
        run: |
          set -uo pipefail
          FROM=$(date -u -d '8 days ago' +%Y-%m-%d)
          curl -sS "$BASE/api/history?days=10" > hist.json
          curl -sS "$BASE/api/schedule"        > sched.json

          echo "오늘(KST): $(jq -r '.today' sched.json)   기준일: $FROM 이후"
          echo
          echo "── 최근 경기와 감지된 이벤트 ──"
          jq -r --arg from "$FROM" '
            .games
            | map(select(.gameDate >= $from))
            | if length == 0 then "해당 기간 경기 기록 없음"
              else (.[] | "  \(.gameDate) \(.oppName) \(.teamScore):\(.oppScore) "
                        + "phase=\(.phase) 이벤트=\(.events|length)"
                        + (if (.events|length) > 0
                           then " [" + ([.events[].kind] | join(",")) + "]"
                           else "  <- 이벤트 0건" end))
              end' hist.json

          echo
          echo "── 일정에 잡힌 최근 경기 ──"
          jq -r --arg from "$FROM" '
            .games | map(select(.gameDate >= $from))
            | "일정 \(length)건",
              (.[] | "  \(.gameDate) \(.oppName) 결과=\(.result // "미정")")' sched.json

      # 크론은 1분마다 돈다. 매 틱의 결과가 'tick {...}' 한 줄로 찍힌다.
      - name: 워커 로그 지켜보기
        if: ${{ inputs.tail }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          echo "=== ${{ inputs.watch_seconds }}초 동안 워커 로그를 지켜본다 ==="
          # timeout 으로는 안 끝난다. npx 를 죽여도 자식 wrangler 가 살아남아
          # 단계의 stdout 을 붙잡고 있어서, 러너가 고아 프로세스를 정리할 때까지
          # 멈춰 있는다(2026-09-27 실측, -s KILL 로도 마찬가지). 직접 띄우고
          # 이름으로 확실히 죽인다.
          npx wrangler tail nc-baseball-alert --format pretty > tail.log 2>&1 &
          sleep "${{ inputs.watch_seconds }}"
          pkill -9 -f 'wrangler tail' || true
          sleep 2
          cat tail.log
          echo "=== 끝 ==="
