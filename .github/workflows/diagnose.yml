name: Diagnose push

# 수동 실행용 진단. 알림이 안 올 때 워커 상태를 본다.
# 개발 환경에서는 workers.dev 접속이 막혀 있어서(403 CONNECT) Actions 에서 돌린다.
#
# 읽기만 한다.
#   1. 공개 API(/api/history, /api/schedule, /api/standings): 감지·배달 지연·순위
#   2. (선택) wrangler tail 로 워커 로그
#
# 푸시 발송 기능은 일부러 안 넣었다. 저장소 쓰기 권한만 있으면 누구나 전 기기에
# 알림을 보낼 수 있게 되기 때문이다. D1·구독 테이블도 건드리지 않는다.
on:
  workflow_dispatch:
    inputs:
      tail:
        description: '워커 로그를 지켜볼지'
        type: boolean
        default: true
      watch_seconds:
        description: '로그를 지켜볼 시간(초)'
        type: string
        default: '150'

permissions:
  contents: read

env:
  BASE: https://nc-baseball-alert.nc-kbo-alert.workers.dev

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts

      # 감지가 안 된 건지, 감지는 됐는데 발송이 안 된 건지 여기서 나눈다.
      # 이벤트가 있으면 감지는 된 것.
      - name: 감지 상태 보기 (공개 API)
        run: |
          set -uo pipefail
          FROM=$(date -u -d '8 days ago' +%Y-%m-%d)
          curl -sS "$BASE/api/history?days=10" > hist.json
          curl -sS "$BASE/api/schedule"        > sched.json

          echo "오늘(KST): $(jq -r '.today' sched.json)   기준일: $FROM 이후"
          echo
          echo "── 최근 경기와 감지된 이벤트 ──"
          jq -r --arg from "$FROM" '
            .games
            | map(select(.gameDate >= $from))
            | if length == 0 then "해당 기간 경기 기록 없음"
              else (.[] | "  \(.gameDate) \(.oppName) \(.teamScore):\(.oppScore) "
                        + "phase=\(.phase) 이벤트=\(.events|length)"
                        + (if (.events|length) > 0
                           then " [" + ([.events[].kind] | join(",")) + "]"
                           else "  <- 이벤트 0건" end))
              end' hist.json

          # 감지 시각과 기기가 띄운 시각의 차이 = 배달 지연. 서버 로그로는 FCM 이
          # 받은 것까지만 보여서 이걸로 본다. 미배달은 끝내 안 뜬 것.
          echo
          echo "── 이벤트별 배달 지연 (감지 → 단말 표시) ──"
          # 시각에 소수점 초가 있다(…16.355Z). fromdateiso8601 이 못 읽어서 뗀다.
          jq -r --arg from "$FROM" '
            def ts: sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601;
            .games
            | map(select(.gameDate >= $from))
            | [.[] | .gameDate as $d | .events[] | {
                d: $d, kind, t: .createdAt,
                lag: (if .deliveredAt == null then null
                      else ((.deliveredAt | ts) - (.createdAt | ts))
                      end)
              }]
            | if length == 0 then "이벤트 없음"
              else
                (.[] | "  \(.d) \(.kind | . + "      " | .[0:7]) \(.t[11:19])  "
                     + (if .lag == null then "미배달" else "\(.lag)초" end)),
                "",
                "  배달됨 \([.[] | select(.lag != null)] | length)건 / 전체 \(length)건",
                (([.[] | select(.lag != null) | .lag]) as $l
                 | if ($l | length) == 0 then "  지연 통계: 배달된 건이 없다"
                   else "  지연 중앙값 \($l | sort | .[(length/2|floor)])초, 최대 \($l | max)초"
                   end)
              end' hist.json

          # 순위와 팀별 잔여 경기. 남은 경기가 있는지(검증할 경기가 있는지)도 여기서 본다.
          echo
          echo "── 순위 (잔여 경기 포함) ──"
          curl -sS "$BASE/api/standings" > rank.json
          jq -r '
            if .standings == null then "순위 자료 없음"
            else (.standings.teams[]
                  | "  \(.rank)위 \(.name | . + "    " | .[0:4]) "
                  + "\(.wins)승 \(.draws)무 \(.losses)패  "
                  + "승률 \((.wins / (if .wins + .losses == 0 then 1 else .wins + .losses end) * 1000 | round) / 1000)  "
                  + "잔여 \(.remaining)")
            end' rank.json

          echo
          echo "── 일정에 잡힌 최근 경기 ──"
          jq -r --arg from "$FROM" '
            .games | map(select(.gameDate >= $from))
            | "일정 \(length)건",
              (.[] | "  \(.gameDate) \(.oppName) 결과=\(.result // "미정")")' sched.json

      # 틱마다 'tick {...}' 한 줄이 찍힌다.
      - name: 워커 로그 지켜보기
        if: ${{ inputs.tail }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          echo "=== ${{ inputs.watch_seconds }}초 동안 워커 로그를 지켜본다 ==="
          # timeout 으로는 안 끝난다. npx 를 죽여도 자식 wrangler 가 남아서 step 이
          # 멈춘다(2026-09-27, -s KILL 도 같음). 직접 띄우고 이름으로 죽인다.
          npx wrangler tail nc-baseball-alert --format pretty > tail.log 2>&1 &
          sleep "${{ inputs.watch_seconds }}"
          pkill -9 -f 'wrangler tail' || true
          sleep 2
          cat tail.log
          echo "=== 끝 ==="
